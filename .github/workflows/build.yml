name: Build AngelChipEmulator JAR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip source if needed
        run: |
          if [ ! -d src/main/java ] && [ -f AngelChipEmulator_PureJava.zip ]; then
            unzip -q -o AngelChipEmulator_PureJava.zip
          fi
          for f in AngelChipEmulator_PureJava/src/main/java/javax/microedition/lcdui/Display.java src/main/java/javax/microedition/lcdui/Display.java; do
            if [ -f "$f" ]; then
              sed -i 's/^\([[:space:]]*\)void repaint(Displayable d, int x, int y, int width, int height)/\1public void repaint(Displayable d, int x, int y, int width, int height)/' "$f"
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build runnable JAR
        run: |
          if [ -d AngelChipEmulator_PureJava ]; then cd AngelChipEmulator_PureJava; fi
          mvn -B -DskipTests clean package

      - name: Upload AngelChipEmulator_PureJava.jar
        uses: actions/upload-artifact@v4
        with:
          name: AngelChipEmulator_PureJava
          path: "**/target/AngelChipEmulator_PureJava.jar"
          if-no-files-found: error
